apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-service

  template:
    metadata:
      labels:
        app: hello-service

    spec:
      containers:
        - name: hello
          image: nginx:1.27

          ports:
            - containerPort: 80