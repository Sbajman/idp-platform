apiVersion: platform.example.com/v1alpha1
kind: Service

metadata:
  name: payment-service

spec:
  owner: payments-team
  description: Payment processing service

  image:
    repository: nginx
    tag: "1.27"

  runtime:
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  environments:
    local:
      replicas: 2