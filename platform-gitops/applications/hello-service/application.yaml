apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-service
  namespace: demo

spec:
  project: default


  sources:
    # --------------------------------------------------
    # Source 1: Platform-owned Helm chart
    # --------------------------------------------------
    - repoURL: https://github.com/Sbajman/idp-platform.git
      targetRevision: main
      path: platform-charts/microservice

      helm:
        releaseName: hello-service

        valueFiles:
          - $values/platform-gitops/applications/hello-service/base/values.yaml


    # --------------------------------------------------
    # Source 2: Application/environment configuration
    # --------------------------------------------------
    - repoURL: https://github.com/Sbajman/idp-platform.git
      targetRevision: main
      ref: values


  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true